name: Publish image and register

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（不含 v 前缀，如 0.1.1）"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # MCP Registry OIDC 认证
      contents: read
      packages: write   # 推送 ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          # tag 触发时取 tag 名；手工触发时取 inputs.version，
          # 否则 GITHUB_REF 是 refs/heads/main，会把分支名当成版本号发出去
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing version: $VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Stamp version from tag
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          jq --arg v "$VERSION" '
            .version = $v
            | .packages = [ .packages[] | .version = $v if .registryType == "pypi" else . ]
            | .packages = [ .packages[] | if .registryType == "oci"
                then .identifier = ("ghcr.io/${{ github.repository }}:" + $v) else . end ]
          ' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
